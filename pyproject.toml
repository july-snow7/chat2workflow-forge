[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat2workflow"
version = "0.1.0"
description = "Convert chat exports into reusable agent workflow cards."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "july-snow7" }
]
keywords = ["wechat", "agent", "workflow", "harness", "llm", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
chat2workflow = "chat2workflow.cli:main"

[project.urls]
Homepage = "https://github.com/july-snow7/chat2workflow-forge"
Repository = "https://github.com/july-snow7/chat2workflow-forge"
Issues = "https://github.com/july-snow7/chat2workflow-forge/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
